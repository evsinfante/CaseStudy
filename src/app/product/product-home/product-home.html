<mat-card>
  @if (hasSelectedProduct()) {
    <mat-card-title align="center" style="margin: 1rem">
      {{ newProduct() ? 'New Product' : 'Product Details' }}
    </mat-card-title>
    <mat-card-content>
      <app-product-details
        [vendors]="vendors()"
        [product]="productInDetail()"
        (saved)="saveProduct($event)"
        (deleted)="deleteProduct($event)"
        (closed)="refresh()"
      />
    </mat-card-content>
  } @else {
    <mat-card-title align="center" style="margin: 1rem">Products</mat-card-title>
    <mat-card-content>
      <table mat-table [dataSource]="productsTable">
        <!-- Header -->
        <tr mat-header-row *matHeaderRowDef="tableColumns; sticky: true"></tr>
        <!-- Row Template -->
        <tr mat-row *matRowDef="let product; columns: tableColumns" (click)="selectProduct(product)"></tr>

        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>
            <div align="center">ID</div>
          </th>
          <td mat-cell *matCellDef="let product">
            <div align="center">{{ product.id }}</div>
          </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>
            <div align="center">Name</div>
          </th>
          <td mat-cell *matCellDef="let product">
            <div align="center">{{ product.name }}</div>
          </td>
        </ng-container>

        <!-- Vendor Column -->
        <ng-container matColumnDef="vendorId">
          <th mat-header-cell *matHeaderCellDef>
            <div align="center">Vendor</div>
          </th>
          <td mat-cell *matCellDef="let product">
            <div align="center">{{ vendorOfId(product.vendorId)?.name ?? 'N/A' }}</div>
          </td>
        </ng-container>
      </table>
    </mat-card-content>
  }
</mat-card>
@if (!hasSelectedProduct()) {
<mat-icon (click)="addNewProduct()" matTooltip="Add New Product" class="addicon" color="primary">
  control_point
</mat-icon>
}
